# ETF 动量轮动 · ETF 目录（etf-map，随技能提交的方法资产）
#
# 用途：pool-build 动作时，由本目录**映射生成当期池** output/etf-rotation/pool.yaml：
#   常驻层全收（layer: base）＋ 行业主题层按 output/prosperity/state.yaml 在跟板块
#   逐板块选 1–2 只（sector 匹配菜单）＋ 扩展层仅在板块/主题明确指向时收编。
# 维护纪律：
#   - 本目录**可以也应该扩充**（新上市主流 ETF 由 agent 在池复核时补录到合适层，
#     并标注上市日期）；它是"目录"不是"池"，不写死当期用哪只。
#   - 上市日期（list 字段）供 agent 排除上市未满 45 交易日的品种（动量信号起不了量）。
#   - note 含 QDII 的品种：入选后实盘需人工核溢价（>2% 暂缓）。
#   - 常驻层的选取原则：跨资产、低相关、是轮动切换的骨头（A股宽基/美股/黄金/国债）；
#     行业主题一律不放常驻层（行业同步性高，靠景气映射进场）。

